TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  Device: 0
  CMakeBuildType: Debug
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  MaxFileName: 128
  DeviceLDS: 163840
  MaxLDS: 163840

BenchmarkProblems:
  ########################################
  # Mixed MXFP4 + FP8 to BF16 - NT
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DataTypeB: F8
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      TransposeA: 0
      TransposeB: 1
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1
      UseBias: 1
      BiasDataTypeList: [b]

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 8,8, 2,2]
          - [16, 16, 128, 1, 1, 4,4, 4,4]
        - ForceDisableShadowInit: [True]
        - UseSgprForGRO: [1]
        - DepthU: [256]
        - AssertFree0ElementMultiple: [1]
        - AssertFree1ElementMultiple: [1]
        - AssertSummationElementMultiple: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DirectToLds: [0]
        - PreloadKernArgs: [1]
        - ClusterLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [3]
        - InnerUnroll: [1]
        - ExpandPointerSwap: [1]
        - TransposeLDS: [1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - GlobalSplitU: [1]
        - GlobalReadPerMfma: [1]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 8192, 1, 16384]
          - Exact: [8192, 8192, 1, 32768]
          - Exact: [8192, 8192, 2, 16384]
          - Exact: [8192, 8192, 4, 16384]
          - Range: [[8192], [8192], [1], [16384, 256, 32768]]
          - Range: [[4096, 1024, 8192], [8192], [1], [16384]]
        - BiasTypeArgs: ['b']
        - ActivationArgs:
          - [Enum: none]

